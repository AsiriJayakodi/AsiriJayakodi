name: Git Koi

on:
  schedule:
    # Runs daily at 00:20 UTC to reflect the day that just ended
    - cron: "20 0 * * *"
  # Allow manual trigger anytime from GitHub Actions tab
  workflow_dispatch:
  # Trigger immediately when the workflow file is updated
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render Git Koi
        uses: yalongwastaken/git-koi@v1
        with:
          # Body choices: white, black, asagi, tea, gold, platinum
          body: white
          output-dir: koi

      - name: Commit the koi if changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          # Committing as github-actions[bot] ensures this does NOT count towards your contribution calendar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi [skip ci]"
          git push --quiet
