name: GitHub Metrics — Isometric Calendar & Topics

on:
  # Run every day at 00:30 UTC to keep metrics fresh
  schedule:
    - cron: "30 0 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Also refresh on every push to main
  push:
    branches:
      - main

jobs:
  metrics:
    name: Generate Metrics SVGs
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Required to commit SVGs back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────
      # 1. Isometric Commit Calendar — Full Year
      # ──────────────────────────────────────────────────
      - name: Isometric Calendar (Full Year)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: AsiriJayakodi
          base: ""
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Colombo
          output_action: none

      # ──────────────────────────────────────────────────
      # 2. Starred Topics — Icon Mode
      # ──────────────────────────────────────────────────
      - name: Starred Topics (Icons)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.topics.icons.svg
          token: NOT_NEEDED
          user: AsiriJayakodi
          base: ""
          config_theme: dark
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons
          config_timezone: Asia/Colombo
          output_action: none

      # ──────────────────────────────────────────────────
      # 3. Force Dark Mode Palette & Clean Font Scaling
      # ──────────────────────────────────────────────────
      - name: Apply Dark Mode Palette and Clean Font Scaling to 3D Isometric Calendar
        run: |
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("metrics.plugin.isocalendar.fullyear.svg", "utf8");
            content = content.replace(/fill="#ebedf0"/g, "fill=\"#1b222d\"");
            content = content.replace(/fill="#9be9a8"/g, "fill=\"#0e4429\"");
            content = content.replace(/fill="#40c463"/g, "fill=\"#006d32\"");
            content = content.replace(/fill="#30a14e"/g, "fill=\"#26a641\"");
            content = content.replace(/fill="#216e39"/g, "fill=\"#39d353\"");
            const style = `<style>@keyframes animation-gauge{0%{stroke-dasharray:0 329}}@keyframes animation-rainbow{0%,to{color:#7f00ff;fill:#7f00ff}14%{color:#a933ff;fill:#a933ff}29%{color:#007fff;fill:#007fff}43%{color:#00ff7f;fill:#00ff7f}57%{color:#ff0;fill:#ff0}71%{color:#ff7f00;fill:#ff7f00}86%{color:red;fill:red}}svg{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;color:#8b949e;font-size:7.5px}h2,h3{margin:4px 0 1px;padding:0;color:#58a6ff;font-weight:500}h2 svg,h3 svg{fill:currentColor}h2{font-size:9px}h3{font-size:8px}h2 svg{width:9px;height:9px}h3 svg{width:8px;height:8px}section>field{margin-left:5px;margin-right:5px}.field{display:flex;align-items:center;margin-bottom:1px;white-space:nowrap;font-size:7.5px}.field svg{margin:0 4px;fill:#8b949e;flex-shrink:0;width:8px;height:8px}.row{display:flex;flex-wrap:wrap}.row section{flex:1 1 0}.calendar.field{margin:4px 0 4px 7px}.calendar .day{outline:1px solid rgba(255,255,255,.05);outline-offset:-1px}svg.calendar{margin-left:13px;margin-top:4px}:root{--color-calendar-graph-day-bg:#1b222d;--color-calendar-graph-day-border:rgba(255,255,255,0.05);--color-calendar-graph-day-L1-bg:#0e4429;--color-calendar-graph-day-L2-bg:#006d32;--color-calendar-graph-day-L3-bg:#26a641;--color-calendar-graph-day-L4-bg:#39d353;--color-calendar-halloween-graph-day-L1-bg:#ffee4a;--color-calendar-halloween-graph-day-L2-bg:#ffc501;--color-calendar-halloween-graph-day-L3-bg:#fe9600;--color-calendar-halloween-graph-day-L4-bg:#03001c;--color-calendar-winter-graph-day-L1-bg:#0a3069;--color-calendar-winter-graph-day-L2-bg:#0969da;--color-calendar-winter-graph-day-L3-bg:#54aeff;--color-calendar-winter-graph-day-L4-bg:#b6e3ff;--color-calendar-graph-day-L4-border:rgba(255,255,255,0.05);--color-calendar-graph-day-L3-border:rgba(255,255,255,0.05);--color-calendar-graph-day-L2-border:rgba(255,255,255,0.05);--color-calendar-graph-day-L1-border:rgba(255,255,255,0.05)}#metrics-end{width:100%}</style>`;
            content = content.replace(/<style>[\\s\\S]*?<\\/style>/, style);
            fs.writeFileSync("metrics.plugin.isocalendar.fullyear.svg", content, "utf8");
          '

      # ──────────────────────────────────────────────────
      # 4. Commit and Push Generated SVGs
      # ──────────────────────────────────────────────────
      - name: Commit and Push SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update metrics SVGs (Dark Theme) [skip ci]"
          file_pattern: "*.svg"
