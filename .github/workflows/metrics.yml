name: GitHub Metrics — Isometric Calendar & Topics

on:
  # Run every day at 00:30 UTC to keep metrics fresh
  schedule:
    - cron: "30 0 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Also refresh on every push to main
  push:
    branches:
      - main

jobs:
  metrics:
    name: Generate Metrics SVGs
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Required to commit SVGs back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────
      # 1. Isometric Commit Calendar — Full Year
      # ──────────────────────────────────────────────────
      - name: Isometric Calendar (Full Year)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: AsiriJayakodi
          base: ""
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Colombo
          output_action: none

      # ──────────────────────────────────────────────────
      # 2. Starred Topics — Icon Mode
      # ──────────────────────────────────────────────────
      - name: Starred Topics (Icons)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.topics.icons.svg
          token: NOT_NEEDED
          user: AsiriJayakodi
          base: ""
          config_theme: dark
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons
          config_timezone: Asia/Colombo
          output_action: none

      # ──────────────────────────────────────────────────
      # 3. Force Dark Mode Palette on 3D Isometric Calendar
      # ──────────────────────────────────────────────────
      - name: Apply Dark Mode Palette to 3D Isometric Calendar
        run: |
          if [ -d "/metrics_renders" ]; then
            sudo cp -f /metrics_renders/*.svg ./ 2>/dev/null || true
            sudo chown -R $(id -u):$(id -g) *.svg 2>/dev/null || true
          fi
          node .github/scripts/apply-dark-theme.js
          git status --short

      # ──────────────────────────────────────────────────
      # 4. Commit and Push Generated SVGs
      # ──────────────────────────────────────────────────
      - name: Commit and Push SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update metrics SVGs (Dark Theme) [skip ci]"
          file_pattern: "*.svg"
